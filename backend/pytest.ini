[pytest]
testpaths = tests
norecursedirs = tests/_legacy
# ES8-BUG-006：业务模型（TestEngine/TestTask/TestCase 等）误采集问题由
# models.py 中 Base.__test__ = False 统一关闭（pytest 尊重该属性，含继承），
# 不改 python_classes 默认值，避免误伤 60+ 个 Test* 测试类。
# ES9-BUG-007 coverage 棘轮：2026-10-21 第七轮全量实测 TOTAL=60.85%（29997 stmts，
# 批次 F（admin/cases_core 路由覆盖 +42 用例）补测后达标 60%，棘轮上调 floor(实测)=60
# （只增不减，见 tests/README-coverage.md）。
# ES11-M19：perf 用例（tests/perf，生产级数据量压测）默认排除，
# 显式运行：python -m pytest tests/perf -m perf --no-cov -q
# ES11-BUG-005：覆盖率门禁移出全局 addopts，防止子集运行（如 ES11 专项两文件）
# 被 60% 棘轮误伤退出码 1。全量回归按方案 §20 命令显式带 --cov 执行：
#   python -m pytest tests/ -q --cov=app --cov-report=term
# 子集运行无需再额外加 --no-cov。
addopts = -m "not perf"
markers =
    perf: 生产级数据量压测（ES11 M19；默认跳过，-m perf 显式选择）
