# EvalShield 前端 nginx 配置：静态托管 + /api 反向代理到后端服务
server {
    listen 80;
    server_name _;

    # 核心：全局显式声明 UTF-8
    # 中文 Windows 下默认 nginx 响应 Content-Type 不带 charset
    # 浏览器就按系统默认 GBK 解码 → UTF-8 字节被当成 GBK → 全乱码
    charset utf-8;
    charset_types text/css text/javascript application/javascript
                  application/json application/jsonld application/xml text/xml
                  application/xhtml+xml application/rss+xml application/atom+xml
                  image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 关键修复：关闭 absolute_redirect + port_in_redirect
    # nginx 对物理目录 /assets 做 301 加斜杠时会丢请求的非标准端口 8891
    # 关闭后 nginx 返回相对重定向 /assets/，浏览器自动拼回原始 origin（保留端口）
    absolute_redirect off;
    port_in_redirect off;

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML（含 / 直接访问与 /eval 等 SPA 路由）绝不缓存：
        # 否则浏览器命中旧 index.html，会继续引用已过期的 hash bundle，前端更新"看不到变化"
        # 静态资源由下方正则 location 单独长缓存（vite 产物带 content hash，互不影响）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # PDF/MD 导出等流式响应
        proxy_buffering off;
    }

    # 静态资源缓存（vite 产物带 content hash，长缓存 + must-revalidate 兜底）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    # HTML 入口绝不缓存（保证 Vite 产物更新后浏览器能拿到新引用）
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}